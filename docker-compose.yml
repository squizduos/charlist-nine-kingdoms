version: '3.8'

services:
  charlist:
    build:
      context: .
      dockerfile: Dockerfile
    image: charlist-nine-kingdoms:latest
    container_name: charlist-nine-kingdoms
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
